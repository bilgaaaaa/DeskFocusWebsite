    // Sends old section links to the same content on the new site, without leaving a history entry.
    (function () {
      const SITE_URL = "https://bilgaaaaa.github.io/pacetasks/";
      const SECTIONS = {
        "#download": "#both",
        "#everything": "#both",

        "#feature-timer": "#day",
        "#feature-silence": "#day",
        "#feature-desktop": "#day",
        "#faq": "#questionsTitle",
      };
      window.location.replace(SITE_URL + (SECTIONS[window.location.hash] ?? ""));
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://bilgaaaaa.github.io/pacetasks/">
